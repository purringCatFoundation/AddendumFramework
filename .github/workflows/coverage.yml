name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ds, openssl, pdo_pgsql, pdo_sqlite, dom, mbstring, simplexml, tokenizer, xml, xmlwriter
          tools: composer:v2
          coverage: xdebug

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-composer-

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare coverage output
        run: mkdir -p coverage

      - name: Run PHPUnit with coverage
        run: composer test -- --coverage-clover coverage/clover.xml
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage/clover.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
